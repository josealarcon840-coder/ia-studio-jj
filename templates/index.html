let currentLang = localStorage.getItem("jj_lang") || "es";

function tl(obj) { if (!obj) return ""; return obj[currentLang] || obj.es || ""; }

}
function setLang(lang) {

const gate = document.getElementById("gate"); const appEl = document.getElementById("app"); const gateError = document.getElementById("gateError"); const userLabel = document.getElementById("userLabel");

function checkSession() {
  const perm = sessionStorage.getItem("jj_session_perm"); 
  const name = sessionStorage.getItem("jj_user_name");
  if (perm === "active") { showApp(name); return true; }
  return false;
}
function showApp(name) { gate.style.display = "none"; appEl.style.display = "block"; userLabel.textContent = name ? name.toUpperCase() : ""; loadModels(); }

async function onTelegramAuth(user) {
  gateError.classList.remove("show");
  try {
      const response = await fetch('/verify-telegram', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(user)
      });
      const data = await response.json();
      
      if (data.access) {
          sessionStorage.setItem("jj_session_perm", "active"); 
          sessionStorage.setItem("jj_user_name", data.nombre || user.first_name); 
          showApp(data.nombre || user.first_name);
      } else {
          gateError.textContent = data.message || t("gate_error");
          gateError.classList.add("show");
      }
  } catch(e) {
      gateError.textContent = "Error de conexión con el servidor.";
      gateError.classList.add("show");
  }
}

function loadModels() { if (MODELS.length) { buildHome(MODELS); return; } fetch("/models").then(r => r.json()).then(models => { MODELS = models; buildHome(models); }); }

function buildHome(models) {
  const categories = {};
  models.forEach(m => { const catName = tl(m.category); categories[catName] = categories[catName] || []; categories[catName].push(m); });
  catContainer.innerHTML = "";
  Object.keys(categories).forEach(cat => {
    const heading = document.createElement("div"); heading.className = "cat-heading"; heading.innerHTML = `<i class="fa-solid fa-caret-right mr-2"></i> ${cat}`; catContainer.appendChild(heading);
    const grid = document.createElement("div"); grid.className = "card-grid";
    categories[cat].forEach(m => {
      const card = document.createElement("button"); card.type = "button"; card.className = "tool-card";
      const icon = m.icon ? m.icon : "fa-wand-magic-sparkles";
      card.innerHTML = `<i class="fa-solid ${icon}"></i><h3>${tl(m.label).split('|')[0].trim()}</h3><p>${tl(m.desc).split('|')[0].trim()}</p>`;
      card.addEventListener("click", () => openTool(m.slug)); grid.appendChild(card);
    });
    catContainer.appendChild(grid);
  });
}

function openTool(slug) {
  currentSlug = slug; const model = MODELS.find(m => m.slug === slug);
  homeView.style.display = "none"; toolView.style.display = "block";
  const icon = model.icon ? model.icon : "fa-wand-magic-sparkles";
  toolTitle.innerHTML = `<i class="fa-solid ${icon} mr-3"></i> ${tl(model.label).split('|')[0].trim()}`; toolDesc.textContent = tl(model.desc).split('|')[0].trim();

}

function renderForm(model) {
  form.innerHTML = "";
  model.fields.forEach(field => {
    const wrap = document.createElement("div"); wrap.className = "field";
    
    if (field.type === "cm_auto_magic") {
        const labelMain = document.createElement("label"); 
        labelMain.innerHTML = "Medidas en Centímetros <span class='req'>*</span>";
        wrap.appendChild(labelMain);

        const row = document.createElement("div"); row.style = "display: flex; gap: 10px;";
        
        const colW = document.createElement("div"); colW.style.flex = "1";
        const labelW = document.createElement("label"); labelW.textContent = "Ancho (cm)"; labelW.style.fontSize="0.75rem"; labelW.style.color="#aaa"; labelW.style.textTransform="none";
        const inpW = document.createElement("input"); inpW.type = "number"; inpW.value = "20"; inpW.step = "0.01";
        colW.appendChild(labelW); colW.appendChild(inpW);
        
        const colH = document.createElement("div"); colH.style.flex = "1";
        const labelH = document.createElement("label"); labelH.textContent = "Alto (cm)"; labelH.style.fontSize="0.75rem"; labelH.style.color="#aaa"; labelH.style.textTransform="none";
        const inpH = document.createElement("input"); inpH.type = "number"; inpH.value = "20"; inpH.step = "0.01";
        colH.appendChild(labelH); colH.appendChild(inpH);
        
        row.appendChild(colW); row.appendChild(colH);
        wrap.appendChild(row);

        const ratioFinalAPI = document.createElement("input");
        ratioFinalAPI.type = "hidden";
        ratioFinalAPI.id = "field_aspect_ratio";
        ratioFinalAPI.name = "aspect_ratio";
        ratioFinalAPI.value = "1:1";
        wrap.appendChild(ratioFinalAPI);

        const info = document.createElement("p");
        info.style = "font-size: 0.75rem; color: var(--ok); margin-top: 8px;";
        info.innerHTML = "💡 Escribe cualquier medida, la IA le dará la proporción perfecta de forma automática.";
        wrap.appendChild(info);

        const calcRatio = () => {
            let w = parseFloat(inpW.value); let h = parseFloat(inpH.value);
            if(w > 0 && h > 0) {
                let ratio = w / h;
                let closest = "1:1";
                let minDiff = Math.abs(ratio - 1);
                const ratiosDict = {"1:1":1, "16:9":16/9, "9:16":9/16, "4:3":4/3, "3:4":3/4, "3:2":3/2, "2:3":2/3};
                for(let k in ratiosDict) {
                    let diff = Math.abs(ratio - ratiosDict[k]);
                    if(diff < minDiff) { minDiff = diff; closest = k; }
                }
                ratioFinalAPI.value = closest;
            }
        };

        inpW.addEventListener("input", calcRatio);
        inpH.addEventListener("input", calcRatio);
        
        form.appendChild(wrap);
        return;
    }

    if (field.type === "checkbox") {
      const row = document.createElement("div"); row.className = "checkbox-row";
      const input = document.createElement("input"); input.type = "checkbox"; input.id = "field_" + field.name; input.name = field.name; input.checked = field.default !== undefined ? field.default : false;
      const label = document.createElement("label"); label.htmlFor = input.id; label.textContent = tl(field.label).split('|')[0].trim();
      row.appendChild(input); row.appendChild(label); wrap.appendChild(row); form.appendChild(wrap); return;
    }
    const label = document.createElement("label"); label.htmlFor = "field_" + field.name; label.textContent = tl(field.label).split('|')[0].trim();
    if (field.required) { const req = document.createElement("span"); req.className = "req"; req.textContent = "*"; label.appendChild(req); }
    wrap.appendChild(label);

    if (field.type === "image" || field.type === "mask") {
      const dz = document.createElement("div"); dz.className = "dropzone";
      const dzIcon = document.createElement("i"); dzIcon.className = "fa-solid fa-cloud-arrow-up";
      const dzText = document.createElement("div"); dzText.className = "dz-text"; dzText.textContent = t("dropzone_text");
      
      const input = document.createElement("input"); input.type = "file"; 
      input.accept = model.response_type === "video" ? "video/mp4, image/*" : "image/*"; 
      input.id = "field_" + field.name; input.name = field.name;
      
      if (field.required) input.required = true;
      input.addEventListener("change", () => {
        if (input.files[0]) {
          dz.classList.add("has-file"); dzIcon.className = "fa-solid fa-file-circle-check"; dzText.textContent = input.files[0].name;
          if(field.name === "input_image" || field.name === "model_image" || field.name === "input_image_0") {
              currentImageData = input.files[0]; 
              urlOriginalMemoria = URL.createObjectURL(input.files[0]);
              urlResultMemoria = urlOriginalMemoria; 
              mainResultImg.src = urlOriginalMemoria;
              tray.style.display = "block"; btnDownloadResult.style.display = "none"; btnRestart.style.display = "block"; quickActionsBar.style.display = "none";
              magicTagsPanel.style.display = "none"; boxesContainer.innerHTML = ""; document.getElementById('btnAntes').style.display = 'none';
              resetearZoom();
              document.getElementById('imgContainer').style.display = 'inline-block';
              document.getElementById('btnCentrar').style.display = 'block';
              document.getElementById('btnZoomLabel').style.display = 'block';
              jsonViewer.style.display = "none";
              
              const mainResultVideo = document.getElementById("mainResultVideo");
              if(mainResultVideo) { mainResultVideo.style.display = "none"; mainResultVideo.src = ""; }
              mainResultImg.style.display = "block";
          }
        } else {
          dz.classList.remove("has-file"); dzIcon.className = "fa-solid fa-cloud-arrow-up"; dzText.textContent = t("dropzone_text");
        }
      });
      dz.appendChild(dzIcon); dz.appendChild(dzText); dz.appendChild(input); wrap.appendChild(dz); form.appendChild(wrap); return;
    }

    let input;
    if (field.type === "textarea") { input = document.createElement("textarea"); } 
    else if (field.type === "select") {
      input = document.createElement("select"); const placeholder = document.createElement("option"); placeholder.value = ""; placeholder.textContent = field.options_url ? t("loading_options") : t("select_placeholder"); input.appendChild(placeholder);
      if (field.options) { field.options.forEach(opt => { const o = document.createElement("option"); o.value = opt.value; o.textContent = tl(opt.label).split('|')[0].trim(); input.appendChild(o); }); } 
      else if (field.options_url) {
        fetch("/style-list?url=" + encodeURIComponent(field.options_url)).then(r => r.json()).then(data => {
            const items = Array.isArray(data) ? data : (data.styles || data.data || []); input.innerHTML = "";
            items.forEach(item => { const id = typeof item === "string" ? item : (item.id || item.style_id || item.value); const name = typeof item === "string" ? item : (item.name || item.label || id); const o = document.createElement("option"); o.value = id; o.textContent = name + (item.premium ? " 💎 PRO" : ""); input.appendChild(o); });
          }).catch(() => { input.innerHTML = `<option value="">${t("load_error")}</option>`; });
      }
    } else if (field.type === "number") { input = document.createElement("input"); input.type = "number"; if (field.default !== undefined) input.value = field.default; } 
    else { input = document.createElement("input"); input.type = "text"; }

    input.id = "field_" + field.name; input.name = field.name; if (field.required) input.required = true;
    wrap.appendChild(input); form.appendChild(wrap);
  });

  const submitBtn = document.createElement("button"); submitBtn.type = "submit"; submitBtn.className = "btn-primary"; submitBtn.id = "btnMainSubmit";
  submitBtn.innerHTML = `<i class="fa-solid fa-bolt mr-2"></i> ${t("run_btn")}`; form.appendChild(submitBtn);
}

        "light": { slug: "light-restore", label: isEs ? "Corregir Luz" : "Fix Light", icon: "fa-sun text-yellow-400", params: {} },
        "gen-bg": { slug: "generate-background", label: isEs ? "Fondo con IA" : "AI Background", icon: "fa-image text-emerald-500", params: {prompt: "Fondo de estudio fotográfico profesional, iluminación perfecta, alta calidad"} }
    };

        if (slug === "enhance-art" && !is8x) {

            keys = ["extract-logo", "remove-bg"];
        } else {
            qaTitle.innerHTML = `<i class="fa-solid fa-check-circle text-ok mr-2"></i> Imagen Maximizada`;
            qaContainer.innerHTML = `<p style="color:var(--text-dim); font-size:0.85rem; margin:0;">La imagen está en su calidad máxima absoluta. ¡Lista para descargar o imprimir!</p>`;
            return; 
        }
    } else {
        qaTitle.innerHTML = `<i class="fa-solid fa-wand-magic-sparkles mr-2"></i> Sugerencias de la IA`;
        if (slug.includes("restore") || slug === "light-restore" || slug === "night-flash" || slug === "backlit-fix") { keys = ["colorize", "upscale-faces", "magic-eraser", "light"]; } 
        else if (slug.includes("colorize")) { keys = ["restore", "upscale-faces", "magic-eraser"]; } 
        else if (slug.includes("remove-background")) { keys = ["upscale-8x", "gen-bg", "magic-eraser"]; } 
        else if (slug.includes("generate") || slug.includes("fairy") || slug.includes("sticker")) { keys = ["upscale-8x", "remove-bg", "extract-logo"]; } 
        else if (slug === "detect-objects" || slug === "remove-objects" || slug === "erase-text" || slug === "erase-wires") { keys = ["upscale-8x", "remove-bg", "light"]; } 
        else { keys = ["upscale-8x", "remove-bg", "magic-eraser"]; }
    }

    keys.forEach(k => {
        const act = actionsDict[k];

        btn.className = "btn-qa";

        btn.onclick = () => ejecutarAccionRapida(act.slug, act.params);
        qaContainer.appendChild(btn);
    });

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const model = MODELS.find(m => m.slug === currentSlug);
  const submitBtn = document.getElementById("btnMainSubmit"); submitBtn.disabled = true;

  statusLine.className = "status-line show"; 
  
  if(model.response_type === "video") {
      statusText.textContent = "Preparando renderizado del video...";
  } else {
      statusText.textContent = t("processing");
  }
  
  btnDownloadResult.style.display = "none"; btnRestart.style.display = "block"; quickActionsBar.style.display = "none";
  magicTagsPanel.style.display = "none"; boxesContainer.innerHTML = ""; document.getElementById('btnAntes').style.display = 'none';
  mainResultImg.classList.add("opacity-50", "blur-sm");
  jsonViewer.style.display = "none";

  const formData = new FormData();
  model.fields.forEach(field => {
    const el = document.getElementById("field_" + field.name);
    if (!el) return;
    if (field.type === "checkbox") { formData.append(field.name, el.checked ? "true" : "false"); } 
    else if (field.type === "image" || field.type === "mask") { if (el.files[0]) formData.append(field.name, el.files[0]); } 
    else if (el.value !== "") { formData.append(field.name, el.value); }
  });

  try {
    const res = await fetch(`/run/${model.slug}`, { method: "POST", body: formData });
    mainResultImg.classList.remove("opacity-50", "blur-sm");
    
    if (!res.headers.get("content-type").includes("application/json")) {
        const blob = await res.blob(); 
        const localBlobUrl = URL.createObjectURL(blob);
        processFinalUrl(localBlobUrl);
        submitBtn.disabled = false;
    } else {
        const data = await res.json();
        if (data.error) {
            statusLine.className = "status-line show error"; statusText.textContent = t("error_prefix") + (data.message || data.detalle || t("generic_error"));
            submitBtn.disabled = false;
            
        // 🎬 POLLING PARA VIDEOS (EVITA EL CORTE DE RENDER)
        } else if (data.is_video_task) {
            statusText.innerHTML = "Procesando Video en la nube (0%). Por favor espera...";
            
            const polling = setInterval(async () => {
                try {
                    let rTask = await fetch(`/check-task?task_id=${data.task_id}&endpoint=${data.endpoint}`);
                    let taskData = await rTask.json();
                    
                    if (taskData.status === "COMPLETED") {
                        clearInterval(polling);
                        statusLine.className = "status-line show ok"; 
                        statusText.innerHTML = "<i class='fa-solid fa-check mr-2'></i> " + t("done");
                        
                        let vUrl = taskData.download_url || taskData.video_url || taskData.url;
                        
                        mainResultImg.style.display = "none";
                        const mainResultVideo = document.getElementById("mainResultVideo");
                        mainResultVideo.style.display = "block";
                        mainResultVideo.src = vUrl;

                        btnDownloadResult.href = vUrl;
                        btnDownloadResult.setAttribute("download", "JJ_Video_Magico.mp4");
                        btnDownloadResult.style.display = "block";
                        document.getElementById("downloadBtnText").innerText = "Descargar Video (MP4)";
                        btnDownloadResult.onclick = null;
                        
                        document.getElementById('tray').style.display = 'block';
                        document.getElementById('imgContainer').style.display = 'inline-block';
                        document.getElementById('btnCentrar').style.display = 'block';
                        document.getElementById('btnZoomLabel').style.display = 'block';
                        submitBtn.disabled = false;
                        
                    } else if (taskData.status === "FAILED") {
                        clearInterval(polling);
                        statusLine.className = "status-line show error";
                        statusText.innerHTML = "Error al renderizar el video.";
                        submitBtn.disabled = false;
                    } else {
                        statusText.innerHTML = "Procesando Video (" + (taskData.progress || 0) + "%)... No cierres la ventana.";
                    }
                } catch(e) { }
            }, 5000);
            return;

        } else if (model.slug === "detect-objects" && data.detected_objects) {
            statusLine.classList.remove("show"); aiSessionId = data.session_id; aiObjects = data.detected_objects; aiSelected.clear();
            magicTagsPanel.style.display = "block"; tagsContainer.innerHTML = ""; boxesContainer.innerHTML = ""; btnExecuteErase.style.display = "none";
            const natW = mainResultImg.naturalWidth; const natH = mainResultImg.naturalHeight;
            aiObjects.forEach((obj, i) => {
                const tag = document.createElement("span"); tag.className = "ai-tag"; tag.textContent = obj.object_description; tag.onclick = () => toggleAiObject(i, tag); tagsContainer.appendChild(tag);
                if(obj.box && natW) {
                    const [xmin, ymin, xmax, ymax] = obj.box; const box = document.createElement('div'); box.id = `box_ai_${i}`; box.className = "ai-box";
                    box.style.left = `${(xmin / natW) * 100}%`; box.style.top = `${(ymin / natH) * 100}%`; box.style.width = `${((xmax - xmin) / natW) * 100}%`; box.style.height = `${((ymax - ymin) / natH) * 100}%`; boxesContainer.appendChild(box);
                }
            });
            tray.style.display = "block"; renderQuickActions(currentSlug); quickActionsBar.style.display = "block";
            document.getElementById('imgContainer').style.display = 'inline-block'; document.getElementById('btnCentrar').style.display = 'block'; document.getElementById('btnZoomLabel').style.display = 'block';
            submitBtn.disabled = false;
        } else {
            statusLine.className = "status-line show ok"; statusText.innerHTML = "<i class='fa-solid fa-check mr-2'></i> " + t("done");
            jsonViewer.value = JSON.stringify(data, null, 2); jsonViewer.style.display = "block"; document.getElementById('imgContainer').style.display = 'none';
            submitBtn.disabled = false;
        }
    }
  } catch (err) {
    statusLine.className = "status-line show error"; statusText.textContent = t("conn_error") + err.message; mainResultImg.classList.remove("opacity-50", "blur-sm");
    submitBtn.disabled = false;
  }
});

async function ejecutarAccionRapida(targetSlug, extraParams = {}) {
    if(!urlResultMemoria) return alert("Primero debes cargar o generar una imagen.");

    if (targetSlug.includes("enhance")) {
        const msg = currentLang === 'es'
            ? "⚠️ REGLA DE ORO DE DISEÑO:\n\nSi escalas la imagen a tamaño gigante ahora, ya no podrás quitarle el fondo o borrar objetos después por el límite de memoria de la IA.\n\nSiempre debes QUITAR EL FONDO PRIMERO y ESCALAR AL FINAL.\n\n¿Deseas proceder a escalar la imagen de todos modos?"
            : "⚠️ DESIGN GOLDEN RULE:\n\nIf you upscale the image to a giant size now, you won't be able to remove the background later due to AI memory limits.\n\nAlways REMOVE BACKGROUND FIRST and UPSCALE LAST.\n\nDo you want to proceed with upscaling anyway?";
        if (!confirm(msg)) return;
    }
    
    // 🔴 MAGIA NUEVA: PREGUNTAR POR EL FONDO
    if (targetSlug === "generate-background") {
        const userPrompt = prompt(
            currentLang === 'es' 
            ? "💡 Escribe la descripción del nuevo fondo:" 
            : "💡 Describe the new background:", 
            extraParams.prompt || ""
        );
        if (userPrompt === null) return; // Si el usuario cancela, no hacemos nada
        if (userPrompt.trim() === "") {
            alert(currentLang === 'es' ? "Debes escribir una descripción para el fondo." : "Prompt cannot be empty.");
            return;
        }
        extraParams.prompt = userPrompt; // Guardamos el nuevo texto del usuario
    }
    
    urlOriginalMemoria = urlResultMemoria; 
    
    statusLine.className = "status-line show"; statusText.textContent = t("processing");
    mainResultImg.classList.add("opacity-50", "blur-sm");
    magicTagsPanel.style.display = "none"; boxesContainer.innerHTML = ""; quickActionsBar.style.display = "none";
    jsonViewer.style.display = "none";
    document.getElementById('imgContainer').style.display = 'inline-block';
    document.getElementById('btnCentrar').style.display = 'block';
    document.getElementById('btnZoomLabel').style.display = 'block';
    
    try {
        const targetModel = MODELS.find(m => m.slug === targetSlug);
        const formData = new FormData();
        const imgField = targetModel.fields.find(f => f.type === "image").name;
        
        // Convertimos el enlace web a archivo real para enviar
        const imgRes = await fetch(urlResultMemoria);
        const imgBlob = await imgRes.blob();
        formData.append(imgField, new File([imgBlob], "imagen_sugerida.jpg", {type: imgBlob.type || "image/jpeg"}));
        
        for(const [k, v] of Object.entries(extraParams)) formData.append(k, v);
        
        targetModel.fields.forEach(f => {
            if(f.name !== imgField && !extraParams[f.name]) {
                if(f.default) formData.append(f.name, f.default);
                else if(f.type === "select" && f.options) formData.append(f.name, f.options[0].value);
            }
        });

        const res = await fetch(`/run/${targetSlug}`, { method: "POST", body: formData });
        mainResultImg.classList.remove("opacity-50", "blur-sm");
        
        if (!res.headers.get("content-type").includes("application/json")) {
            currentSlug = targetSlug;
            const blobFinal = await res.blob(); 
            processFinalUrl(URL.createObjectURL(blobFinal));
        } else {
            const data = await res.json();
            if(data.error) throw new Error(data.message);
        }
    } catch(err) {
        alert("Error al procesar: " + err.message); mainResultImg.classList.remove("opacity-50", "blur-sm"); quickActionsBar.style.display = "block";
    }
}

function processFinalUrl(url) {
    let displayUrl = url;
    let downloadUrl = url;
    
    if(url.startsWith("http")) {
        displayUrl = "/proxy-image?url=" + encodeURIComponent(url);
        downloadUrl = "/proxy-image?url=" + encodeURIComponent(url) + "&dl=1";
    }
    
    urlResultMemoria = displayUrl; 
    
    const mainResultVideo = document.getElementById("mainResultVideo");
    if(mainResultVideo) { mainResultVideo.style.display = "none"; mainResultVideo.src = ""; }
    mainResultImg.style.display = "block";
    mainResultImg.src = displayUrl; 
    
    statusLine.className = "status-line show ok"; statusText.innerHTML = "<i class='fa-solid fa-check mr-2'></i> " + t("done");
    
    btnDownloadResult.href = downloadUrl;
    btnDownloadResult.setAttribute("download", "JJ_Studio_Diseño.png");
    btnDownloadResult.style.display = "block";
    
    document.getElementById("downloadBtnText").innerText = t("download_btn");
    btnDownloadResult.onclick = null;
    
    renderQuickActions(currentSlug);
    quickActionsBar.style.display = "block"; 
    
    document.getElementById('tray').style.display = 'block';

    document.getElementById('btnAntes').style.display = 'block';
    document.getElementById('imgContainer').style.display = 'inline-block';
    document.getElementById('btnCentrar').style.display = 'block';
    document.getElementById('btnZoomLabel').style.display = 'block';
    jsonViewer.style.display = "none";
    
    resetearZoom();
}

let escalaImg = 1, estaArrastrando = false, panX = 0, panY = 0, startX, startY;
const contVisor = document.getElementById('visorContenedor'); const contZoom = document.getElementById('viewerWrapper'); const lblZoom = document.getElementById('lblZoom');

function actualizarTransform() { contZoom.style.transform = `translate(${panX}px, ${panY}px) scale(${escalaImg})`; lblZoom.innerText = Math.round(escalaImg * 100) + '%'; }
function resetearZoom() { escalaImg = 1; panX = 0; panY = 0; actualizarTransform(); }

contVisor.addEventListener('wheel', (e) => {
    if ((!mainResultImg.src && !document.getElementById("mainResultVideo").src) || jsonViewer.style.display === "block") return; e.preventDefault();
    if (e.deltaY < 0) escalaImg += 0.15; else escalaImg -= 0.15;
    escalaImg = Math.max(0.5, Math.min(escalaImg, 8)); if(escalaImg === 1) { panX = 0; panY = 0; } actualizarTransform();
});
contVisor.addEventListener('mousedown', (e) => { if (e.button !== 0 || (!mainResultImg.src && !document.getElementById("mainResultVideo").src) || jsonViewer.style.display === "block") return; estaArrastrando = true; startX = e.clientX - panX; startY = e.clientY - panY; });
window.addEventListener('mousemove', (e) => { if (!estaArrastrando) return; panX = e.clientX - startX; panY = e.clientY - startY; actualizarTransform(); });
window.addEventListener('mouseup', () => { estaArrastrando = false; });

function mostrar(original) { if(!urlOriginalMemoria || !urlResultMemoria) return; mainResultImg.src = original ? urlOriginalMemoria : urlResultMemoria; document.getElementById('boxesContainer').style.opacity = original ? '0' : '1'; }

function toggleAiObject(index, tagEl) {
    const box = document.getElementById(`box_ai_${index}`);
    if (aiSelected.has(index)) { aiSelected.delete(index); tagEl.classList.remove("selected"); if(box) box.classList.remove("selected"); } 
    else { aiSelected.add(index); tagEl.classList.add("selected"); if(box) box.classList.add("selected"); }
    btnExecuteErase.style.display = aiSelected.size > 0 ? "inline-block" : "none";
}

btnExecuteErase.addEventListener("click", async () => {
    btnExecuteErase.disabled = true; btnExecuteErase.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin mr-2"></i> Procesando...`;
    mainResultImg.classList.add("opacity-50", "blur-sm"); quickActionsBar.style.display = "none";
    const formData = new FormData(); 
    
    let imageToUse = urlResultMemoria ? urlResultMemoria : currentImageData;
    
    if (typeof imageToUse === "string") {
        if (imageToUse.startsWith("blob:")) {
            const blobReq = await fetch(imageToUse); const blobData = await blobReq.blob();
            formData.append("input_image", new File([blobData], "magic.png", {type: "image/png"}));
        } else { formData.append("input_image", imageToUse); }
    } else { formData.append("input_image", imageToUse); }
    
    formData.append("original_session_id", aiSessionId);
    formData.append("erase_mode", "ultra");
    const objectsToErase = []; aiSelected.forEach(i => objectsToErase.push(aiObjects[i])); formData.append("mask_objects", JSON.stringify(objectsToErase));
    
    try {
        const res = await fetch(`/run/execute-magic-erase`, { method: "POST", body: formData });
        mainResultImg.classList.remove("opacity-50", "blur-sm");
        
        if (!res.headers.get("content-type").includes("application/json")) {
            const blob = await res.blob(); processFinalUrl(URL.createObjectURL(blob));
        } else {
            const json = await res.json();
            if(json.error) throw new Error(json.message || json.detalle || "Parámetros incorrectos");
        }
        magicTagsPanel.style.display = "none"; boxesContainer.innerHTML = "";
    } catch(err) { alert("Error al borrar: " + err.message); mainResultImg.classList.remove("opacity-50", "blur-sm"); quickActionsBar.style.display = "block"; } 
    finally { btnExecuteErase.disabled = false; btnExecuteErase.innerHTML = `<i class="fa-solid fa-eraser mr-2"></i> ` + t("magic_btn_apply"); }
});

document.querySelectorAll(".lang-switch button").forEach(btn => { btn.classList.toggle("active", btn.dataset.lang === currentLang); });
applyStaticText(); checkSession();
</script>
</body>
